<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KrishiGPT-nano — Agriculture Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>KrishiGPT-nano</h1>
      <span class="badge">experimental &middot; not agricultural advice</span>
    </div>
    <div class="topbar-actions">
      <span id="model-status" class="status" title="model status">checking&hellip;</span>
      <button id="clear-btn" class="ghost" type="button">Clear chat</button>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div class="mode-row">
      <label class="mode-toggle" title="Quote passages from the training corpus (retrieval) instead of generating from the model's memory. Grounded answers are verbatim corpus text with sources.">
        <input type="checkbox" id="grounded-toggle">
        <span>Grounded mode <small>(quote training corpus &mdash; RAG)</small></span>
      </label>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1"
        placeholder="Ask about crops, soil, irrigation, fertilizers, pests, diseases&hellip;"></textarea>
      <button id="send-btn" type="button">Send</button>
    </div>
    <p class="hint">
      Enter = send &middot; Shift+Enter = new line &middot; 128-token context:
      long histories are truncated and the model keeps no memory.
      All answers are model-generated text, not professional advice.
    </p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
